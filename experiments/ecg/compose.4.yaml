x-common-environment: &common-environment
  TRAINER_MODULE: "${TRAINER_MODULE:-experiments.ecg.trainer}"
  CLIENT_COUNT: "4"
  HEAD_CLIENT_IDS: "3"
  RUN_ID: "${RUN_ID:-ecg-4-ring}"
  ROUNDS: "${ROUNDS:-50}"
  LOCAL_EPOCHS: "${LOCAL_EPOCHS:-1}"
  BATCH_SIZE: "${BATCH_SIZE:-32}"
  LEARNING_RATE: "${LEARNING_RATE:-0.1}"
  MOMENTUM: "${MOMENTUM:-0}"
  PARTITION_MODE: "${PARTITION_MODE:-iid}"
  DIRICHLET_ALPHA: "${DIRICHLET_ALPHA:-0.5}"
  SEED: "${SEED:-42}"
  REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5}"
  REQUEST_RETRIES: "${REQUEST_RETRIES:-3}"
  RETRY_DELAY: "${RETRY_DELAY:-1}"
  HEAD_START_DELAY: "${HEAD_START_DELAY:-5}"
  MAX_TRAIN_SAMPLES: "${MAX_TRAIN_SAMPLES:-0}"
  MAX_TEST_SAMPLES: "${MAX_TEST_SAMPLES:-0}"
  TORCH_NUM_THREADS: "${TORCH_NUM_THREADS:-1}"

x-client: &client
  image: dfl-ecg:latest
  restart: "no"
  volumes:
    - type: bind
      source: "${ECG_DATA_DIR:-../../../FedCVD/data}"
      target: /data
      read_only: true
    - ../../results/ecg-4:/results
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
    interval: 5s
    timeout: 3s
    start_period: 20s
    retries: 12

services:
  client-0:
    <<: *client
    build:
      context: ../..
      dockerfile: experiments/ecg/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-environment
      CLIENT_ID: "0"
      CLIENT_NAME: "client-0"
      NEIGHBORS: "http://client-3:8000,http://client-1:8000"

  client-1:
    <<: *client
    ports:
      - "8001:8000"
    environment:
      <<: *common-environment
      CLIENT_ID: "1"
      CLIENT_NAME: "client-1"
      NEIGHBORS: "http://client-0:8000,http://client-2:8000"

  client-2:
    <<: *client
    ports:
      - "8002:8000"
    environment:
      <<: *common-environment
      CLIENT_ID: "2"
      CLIENT_NAME: "client-2"
      NEIGHBORS: "http://client-1:8000,http://client-3:8000"

  client-3:
    <<: *client
    ports:
      - "8003:8000"
    depends_on:
      client-0:
        condition: service_healthy
      client-1:
        condition: service_healthy
      client-2:
        condition: service_healthy
    environment:
      <<: *common-environment
      CLIENT_ID: "3"
      CLIENT_NAME: "client-3"
      NEIGHBORS: "http://client-2:8000,http://client-0:8000"
