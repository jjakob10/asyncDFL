 stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="49" width="383" height="328" rx="24" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/><text x="57" y="77" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="39"><tspan x="57" dy="39">Peer clients</tspan></text><text x="57" y="143" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="28"><tspan x="57" dy="28">POST /start</tspan><tspan x="57" dy="35.0">GET /model</tspan><tspan x="57" dy="35.0">GET /health</tspan><tspan x="57" dy="35.0">GET /status</tspan></text><rect x="633" y="12" width="567" height="437" rx="24" fill="#d0ebff" stroke="#1971c2" stroke-width="3"/><text x="665" y="43" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="38"><tspan x="665" dy="38">API layer – app.main</tspan></text><text x="665" y="103" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="28"><tspan x="665" dy="28">FastAPI on :8000</tspan><tspan x="665" dy="35.0">JSON control/status</tspan><tspan x="665" dy="35.0">Binary model payload</tspan><tspan x="665" dy="35.0">202 / 409 idempotency</tspan><tspan x="665" dy="35.0">Lifespan creates runtime</tspan></text><text x="660" y="351" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="28"><tspan x="660" dy="28">/health  /start  /model  /status</tspan></text><text x="429" y="259" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="429" dy="25">HTTP / REST</tspan></text><text x="1216" y="162" text-anchor="start" fill="#e67700" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="1216" dy="25">delegates</tspan></text><rect x="1376" y="70" width="912" height="304" rx="24" fill="#fff3bf" stroke="#e67700" stroke-width="3"/><text x="1410" y="98" text-anchor="start" fill="#e67700" font-family="Cascadia Mono, Consolas, monospace" font-size="37"><tspan x="1410" dy="37">Orchestration – ClientRuntime</tspan></text><text x="1410" y="155" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="27"><tspan x="1410" dy="27">RLock protects published state</tspan><tspan x="1410" dy="33.75">Daemon worker executes rounds</tspan><tspan x="1410" dy="33.75">Retries + timeout with httpx</tspan><tspan x="1410" dy="33.75">Start floods to configured neighbors</tspan><tspan x="1410" dy="33.75">Snapshot headers: client, version, round, samples</tspan></text><text x="1240" y="481" text-anchor="start" fill="#7048e8" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="1240" dy="25">protocol call</tspan></text><text x="1740" y="526" text-anchor="start" fill="#2b8a3e" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="1740" dy="25">aggregate</tspan></text><rect x="38" y="620" width="494" height="312" rx="24" fill="#ffe8cc" stroke="#d9480f" stroke-width="3"/><text x="71" y="652" text-anchor="start" fill="#d9480f" font-family="Cascadia Mono, Consolas, monospace" font-size="37"><tspan x="71" dy="37">Local data</tspan></text><text x="71" y="716" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="27"><tspan x="71" dy="27">IID or Dirichlet shard</tspan><tspan x="71" dy="33.75">train_loader / test_loader</tspan><tspan x="71" dy="33.75">sample_count = weight</tspan></text><text x="548" y="764" text-anchor="start" fill="#d9480f" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="548" dy="25">batches</tspan></text><rect x="68" y="1032" width="492" height="273" rx="24" fill="#f1f3f5" stroke="#495057" stroke-width="3"/><text x="100" y="1061" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="37"><tspan x="100" dy="37">Configuration</tspan></text><text x="100" y="1126" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="100" dy="26">Settings.from_env()</tspan><tspan x="100" dy="32.5">neighbors, rounds, trainer</tspan><tspan x="100" dy="32.5">timeouts, seed, partition</tspan><tspan x="100" dy="32.5">used by runtime + trainer</tspan></text><rect x="687" y="633" width="787" height="601" rx="24" fill="#f3f0ff" stroke="#7048e8" stroke-width="4" stroke-dasharray="14 12"/><text x="733" y="676" text-anchor="start" fill="#7048e8" font-family="Cascadia Mono, Consolas, monospace" font-size="39"><tspan x="733" dy="39">Learning plug-in boundary</tspan></text><text x="733" y="748" text-anchor="start" fill="#7048e8" font-family="Cascadia Mono, Consolas, monospace" font-size="31"><tspan x="733" dy="31">app.training.Trainer protocol</tspan></text><text x="733" y="830" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="28"><tspan x="733" dy="28">create_model()</tspan><tspan x="733" dy="35.0">load_data(settings) → DataBundle</tspan><tspan x="733" dy="35.0">train_local(state, loader, settings)</tspan><tspan x="733" dy="35.0">evaluate(state, test_loader)</tspan></text><rect x="759" y="1069" width="658" height="117" rx="24" fill="#e5dbff" stroke="#7048e8" stroke-width="3"/><text x="796" y="1104" text-anchor="start" fill="#7048e8" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="796" dy="26">MNIST / CIFAR-10 / TON_IOT trainer</tspan></text><rect x="1582" y="705" width="675" height="474" rx="24" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="3"/><text x="1613" y="736" text-anchor="start" fill="#2b8a3e" font-family="Cascadia Mono, Consolas, monospace" font-size="38"><tspan x="1613" dy="38">Federation – app.federation</tspan></text><text x="1613" y="800" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="27"><tspan x="1613" dy="27">CPU-cloned StateDict</tspan><tspan x="1613" dy="33.75">serialize / deserialize</tspan><tspan x="1613" dy="33.75">shape + dtype compatibility</tspan><tspan x="1613" dy="33.75">sample-count-weighted FedAvg</tspan><tspan x="1613" dy="33.75">atomic model publication</tspan></text><text x="1760" y="1216" text-anchor="start" fill="#087f5b" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="1760" dy="25">persist</tspan></text><rect x="1582" y="1289" width="675" height="215" rx="24" fill="#e6fcf5" stroke="#087f5b" stroke-width="3"/><text x="1614" y="1321" text-anchor="start" fill="#087f5b" font-family="Cascadia Mono, Consolas, monospace" font-size="37"><tspan x="1614" dy="37">Outputs</tspan></text><text x="1614" y="1381" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="1614" dy="26">• metrics JSONL</tspan><tspan x="1614" dy="32.5">• final .pt snapshot</tspan><tspan x="1614" dy="32.5">• status/errors</tspan></text><rect x="355" y="1337" width="1178" height="176" rx="24" fill="#fff9db" stroke="#f08c00" stroke-width="3"/><text x="473" y="1379" text-anchor="start" fill="#f08c00" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="473" dy="34">Round 1…N</tspan></text><text x="473" y="1438" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="473" dy="25">local train → fetch neighbors → FedAvg → evaluate → publish</tspan></text></svg>