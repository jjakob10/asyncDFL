<svg xmlns="http://www.w3.org/2000/svg" width="2418" height="1510" viewBox="0 0 2418 1510"><rect width="100%" height="100%" fill="#ffffff"/><line x1="1152.5" y1="98.0" x2="1500.5" y2="241.5" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><line x1="1500.5" y1="241.5" x2="1642.5" y2="591.5" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><line x1="1642.5" y1="591.5" x2="1500.5" y2="940.0" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><line x1="1500.5" y1="940.0" x2="1151.5" y2="1086.5" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><line x1="1151.5" y1="1086.5" x2="796.5" y2="940.0" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><line x1="796.5" y1="940.0" x2="653.5" y2="591.5" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><line x1="653.5" y1="591.5" x2="796.5" y2="242.0" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><line x1="796.5" y1="242.0" x2="1152.5" y2="98.0" stroke="#1971c2" stroke-width="5" stroke-linecap="round"/><text x="102" y="83" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="29"><tspan x="102" dy="29">Example client details</tspan></text><rect x="69" y="139" width="521" height="312" rx="24" fill="#f8f9fa" stroke="#868e96" stroke-width="3"/><text x="104" y="178" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="37"><tspan x="104" dy="37">client-3</tspan></text><text x="104" y="249" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="104" dy="26">NEIGHBORS:</tspan><tspan x="104" dy="32.5">http://client-2:8000</tspan><tspan x="104" dy="32.5">http://client-4:8000</tspan><tspan x="104" dy="32.5">local partition + own model</tspan></text><rect x="1704" y="139" width="588" height="313" rx="24" fill="#f8f9fa" stroke="#868e96" stroke-width="3"/><text x="1737" y="177" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="37"><tspan x="1737" dy="37">Deployment boundary</tspan></text><text x="1737" y="247" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="1737" dy="26">8 independent Docker services</tspan><tspan x="1737" dy="32.5">internal API port 8000</tspan><tspan x="1737" dy="32.5">host ports 8000…8007</tspan><tspan x="1737" dy="32.5">shared /results volume</tspan></text><ellipse cx="1152.5" cy="98.0" rx="127.5" ry="89.0" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/><text x="1070" y="44" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="1070" dy="34">client-0</tspan></text><text x="1085" y="111" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="1085" dy="26">:8000</tspan></text><ellipse cx="1500.5" cy="241.5" rx="127.5" ry="90.5" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/><text x="1418" y="186" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="1418" dy="34">client-1</tspan></text><text x="1433" y="253" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="1433" dy="26">:8000</tspan></text><ellipse cx="1642.5" cy="591.5" rx="127.5" ry="90.5" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/><text x="1560" y="536" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="1560" dy="34">client-2</tspan></text><text x="1575" y="603" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="1575" dy="26">:8000</tspan></text><ellipse cx="1500.5" cy="940.0" rx="127.5" ry="91.0" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/><text x="1418" y="884" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="1418" dy="34">client-3</tspan></text><text x="1433" y="951" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="1433" dy="26">:8000</tspan></text><ellipse cx="1151.5" cy="1086.5" rx="127.5" ry="91.5" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/><text x="1069" y="1030" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="1069" dy="34">client-4</tspan></text><text x="1084" y="1097" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="1084" dy="26">:8000</tspan></text><ellipse cx="796.5" cy="940.0" rx="127.5" ry="91.0" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/><text x="714" y="884" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="714" dy="34">client-5</tspan></text><text x="729" y="951" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="729" dy="26">:8000</tspan></text><ellipse cx="653.5" cy="591.5" rx="127.5" ry="91.5" fill="#d0ebff" stroke="#1971c2" stroke-width="4"/><text x="571" y="535" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="571" dy="34">client-6</tspan></text><text x="586" y="602" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="586" dy="26">:8000</tspan></text><ellipse cx="796.5" cy="242.0" rx="127.5" ry="91.0" fill="#fff3bf" stroke="#e67700" stroke-width="4"/><text x="714" y="186" text-anchor="start" fill="#e67700" font-family="Cascadia Mono, Consolas, monospace" font-size="34"><tspan x="714" dy="34">client-7</tspan></text><text x="729" y="253" text-anchor="start" fill="#e67700" font-family="Cascadia Mono, Consolas, monospace" font-size="26"><tspan x="729" dy="26">HEAD</tspan></text><ellipse cx="1148.0" cy="591.0" rx="210.0" ry="160.0" fill="#ffffff" stroke="#868e96" stroke-width="3" stroke-dasharray="14 12"/><text x="987" y="499" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="41"><tspan x="987" dy="41">Logical ring</tspan></text><text x="989" y="578" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="28"><tspan x="989" dy="28">no central server</tspan></text><text x="992" y="644" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="28"><tspan x="992" dy="28">asynchronous FedAvg</tspan></text><rect x="69" y="1132" width="680" height="303" rx="24" fill="#fff3bf" stroke="#e67700" stroke-width="3"/><text x="101" y="1165" text-anchor="start" fill="#e67700" font-family="Cascadia Mono, Consolas, monospace" font-size="36"><tspan x="101" dy="36">Head: client-7</tspan></text><text x="101" y="1221" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="101" dy="25">HEAD_CLIENT_IDS=7</tspan><tspan x="101" dy="31.25">waits for peers to be healthy</tspan><tspan x="101" dy="31.25">auto POST /start with shared run_id</tspan><tspan x="101" dy="31.25">neighbors: client-6 and client-0</tspan></text><rect x="791" y="1209" width="714" height="189" rx="24" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/><text x="825" y="1239" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="36"><tspan x="825" dy="36">REST model exchange</tspan></text><text x="825" y="1303" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="825" dy="25">application/octet-stream StateDict</tspan></text><text x="825" y="1352" text-anchor="start" fill="#495057" font-family="Cascadia Mono, Consolas, monospace" font-size="24"><tspan x="825" dy="24">headers: ID • version • round • samples</tspan></text><rect x="1528" y="1132" width="764" height="303" rx="24" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="3"/><text x="1561" y="1165" text-anchor="start" fill="#2b8a3e" font-family="Cascadia Mono, Consolas, monospace" font-size="36"><tspan x="1561" dy="36">Every round on every client</tspan></text><text x="1561" y="1221" text-anchor="start" fill="#343a40" font-family="Cascadia Mono, Consolas, monospace" font-size="25"><tspan x="1561" dy="25">1  train local partition</tspan><tspan x="1561" dy="31.25">2  GET /model from both neighbors</tspan><tspan x="1561" dy="31.25">3  FedAvg by sample_count</tspan><tspan x="1561" dy="31.25">4  publish version + evaluate + record</tspan></text><text x="174" y="1462" text-anchor="start" fill="#1971c2" font-family="Cascadia Mono, Consolas, monospace" font-size="23"><tspan x="174" dy="23">Blue bidirectional edges = each endpoint can POST /start and GET /model from the neighbor URL</tspan></text></svg>